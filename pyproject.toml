[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "twinpix"
version = "0.1.0"
description = "Find near-duplicate photos (bursts, resized and re-saved copies) with perceptual hashing and multi-index hashing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "aadijewargi" }]
keywords = ["duplicates", "photos", "perceptual-hash", "bk-tree", "multi-index-hashing", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Environment :: Console",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
dependencies = ["Pillow>=10.0", "numpy>=1.24"]

[project.optional-dependencies]
heic = ["pillow-heif>=0.16"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/aadijewargi/twinpix"
Issues = "https://github.com/aadijewargi/twinpix/issues"

[project.scripts]
twinpix = "twinpix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "twinshot"
version = "0.1.0"
description = "Find near-duplicate photos (bursts, resizes, re-saves) with perceptual hashing and multi-index hashing, review them in an HTML report, and quarantine rejects safely."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "aadijewargi" }]
requires-python = ">=3.9"
dependencies = ["Pillow>=9.0", "numpy>=1.21"]
keywords = ["duplicates", "photos", "perceptual-hash", "bk-tree", "dedupe", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Environment :: Console",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
heic = ["pillow-heif>=0.13"]
bench = ["matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/aadijewargi/twinshot"
Issues = "https://github.com/aadijewargi/twinshot/issues"

[project.scripts]
twinshot = "twinshot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
